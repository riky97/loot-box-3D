<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Mirrors $color-background in src/styles/_tokens.scss; HTML meta cannot read CSS vars. -->
    <meta name="theme-color" content="#FEF5E6" />
    <!-- Brand faces. Families are declared in src/styles/_tokens.scss; keep the two in sync. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400..800&family=Chivo:wght@400;500;700&family=Martian+Mono:wdth,wght@100..112.5,400..700&display=swap"
    />
    <!-- Title and description are overwritten at runtime from the active locale. -->
    <title>Loot Box 3D</title>
    <meta name="description" content="" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
